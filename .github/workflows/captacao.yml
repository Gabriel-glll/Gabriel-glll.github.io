name: Captação ZFF
run-name: Captação ${{ inputs.pedido || 'fila' }}

on:
  push:
    branches: [main]
    paths: ["captacao/fila/*.json"]
  workflow_dispatch:
    inputs:
      url:
        description: Link do anúncio do imóvel
        required: true
      pedido:
        description: Identificador do pedido (gerado pelo hub)
        required: true
      codigo:
        description: Código do imóvel (opcional)
        required: false
      valor:
        description: Valor de venda (opcional)
        required: false
      html_url:
        description: Página entregue pelo navegador (sites com anti-robô)
        required: false
      modo:
        description: "'comparar' = só ler o empreendimento para o comparador de lançamentos"
        required: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow opencv-python-headless numpy scipy onnxruntime
      - name: Modelo de preenchimento (LaMa) em cache
        uses: actions/cache@v4
        with:
          path: .github/captacao/lama.onnx
          key: lama-fp32-v1
      - name: Baixar modelo se faltar
        run: |
          [ -s .github/captacao/lama.onnx ] || curl -sSL -o .github/captacao/lama.onnx             https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
      - name: Ler empreendimento para o comparador (Novos Lançamentos)
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'comparar'
        env:
          URL: ${{ inputs.url }}
          PEDIDO: ${{ inputs.pedido }}
          HTML_URL: ${{ inputs.html_url }}
        run: python .github/captacao/comparar.py --url "$URL" --pedido "$PEDIDO" --html-url "$HTML_URL" > /dev/null
      - name: Ler anúncio e montar página (hub)
        if: github.event_name == 'workflow_dispatch' && inputs.modo != 'comparar'
        env:
          URL: ${{ inputs.url }}
          PEDIDO: ${{ inputs.pedido }}
          CODIGO: ${{ inputs.codigo }}
          VALOR: ${{ inputs.valor }}
          HTML_URL: ${{ inputs.html_url }}
        run: python .github/captacao/gerar.py --url "$URL" --pedido "$PEDIDO" --codigo "$CODIGO" --valor "$VALOR" --html-url "$HTML_URL" > /dev/null
      - name: Ler anúncios da fila
        if: github.event_name == 'push'
        run: |
          for f in captacao/fila/*.json; do
            [ -e "$f" ] || continue
            python - "$f" <<'PY'
          import json, subprocess, sys, os
          p = sys.argv[1]; d = json.load(open(p, encoding="utf-8"))
          pedido = d.get("pedido") or os.path.basename(p)[:-5]
          subprocess.run([sys.executable, ".github/captacao/gerar.py", "--url", d["url"], "--pedido", pedido,
                          "--codigo", d.get("codigo") or "", "--valor", str(d.get("valor") or "")], stdout=subprocess.DEVNULL)
          os.remove(p)
          PY
          done
      - name: Publicar
        timeout-minutes: 4
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config user.name "Captação ZFF"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sem "git pull" (trava em clone raso): aponta para a ponta atual do main e
          # recommita só a pasta captacao/ por cima.
          # Pedidos rodam em paralelo: --ignore-removal evita apagar páginas que outro
          # pedido publicou depois do checkout deste.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth=1 origin main
            git reset -q --mixed origin/main
            python .github/captacao/mesclar.py
            git add --ignore-removal captacao
            git add -A captacao/fila 2>/dev/null || true
            git reset -q -- captacao/_entrada.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Captação ${{ inputs.pedido || 'fila' }}"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
