<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carteira ZFF</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ln:#e6e3dc;
--a:#1f8a4c;--b:#2f6fcf;--c:#c98a12;--f:#c8432f;--idea:#6b3fd1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#efeee9;--mut:#9a988f;--ln:#2e2d2a;--a:#4cc27e;--b:#6aa0f0;--c:#e2ad45;--f:#ec6a55;--idea:#a68cf0}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#efeee9;--mut:#9a988f;--ln:#2e2d2a;--a:#4cc27e;--b:#6aa0f0;--c:#e2ad45;--f:#ec6a55;--idea:#a68cf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .dot{width:10px;height:10px;border-radius:50%}
h2 small{color:var(--mut);font-weight:400}
.lista{background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--ln);border-left:4px solid transparent}
.row:first-child{border-top:0}
.nome{font-weight:600}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px;border:1px solid currentColor}
.tag.idea{color:var(--idea)}.tag.emp{color:var(--mut)}
.tel{color:var(--mut);font-size:13px;text-decoration:none}
.tel:hover{text-decoration:underline}
.tempo{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tempo.ok{color:var(--a);font-weight:500}
.mot{text-align:right;color:var(--mut);font-size:12px}
.vazio{padding:12px 14px;color:var(--mut)}
</style>
</head>

const GR=[["A","Ótimo","responde rápido e sempre","var(--a)"],["B","Bom","responde no mesmo dia","var(--b)"],["C","Lento","responde, mas demora","var(--c)"],["F","Follow-up","não responde direito: montar sequência","var(--f)"]];
let filtro="todos";
function tempo(ts){if(!ts)return null;const h=(Date.now()/1000-ts)/3600;if(h<1)return"menos de 1h";if(h<24)return Math.round(h)+"h";const d=Math.floor(h/24);return d+(d==1?" dia":" dias")}
function fone(t){const m=t.match(/^55(\d\d)(\d{4,5})(\d{4})$/);return m?`(${m[1]}) ${m[2]}-${m[3]}`:"+"+t}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 const rows=DADOS.filter(c=>filtro=="todos"||c.origem.startsWith(filtro));
 document.getElementById("out").innerHTML=GR.map(([k,n,d,cor])=>{
  const g=rows.filter(c=>c.classe==k);
  return `<h2><span class="dot" style="background:${cor}"></span>${n} <small>${g.length} · ${d}</small></h2><div class="lista">`+
  (g.length?g.map(c=>{const t=tempo(c.sem_resp_desde);
   return `<div class="row" style="border-left-color:${cor}"><div><span class="nome">${esc(c.nome)}</span><span class="tag ${c.origem=="IDEA"?"idea":"emp"}">${c.origem=="IDEA"?"IDEA":"Empresa"}</span></div>
   <div class="tempo ${t?"":"ok"}">${t?"sem resposta há "+t:"respondeu por último"}</div>
   <a class="tel" href="https://wa.me/${c.tel}" target="_blank" rel="noopener">${fone(c.tel)}</a><div class="mot">${esc(c.motivo)}</div></div>`}).join(""):`<div class="vazio">Ninguém aqui.</div>`)+`</div>`}).join("");
}
document.getElementById("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filtro=b.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));render()};
render();
</script>
