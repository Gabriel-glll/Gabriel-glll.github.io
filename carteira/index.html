<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Carteira ZFF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
/* Mesa de prospecção: placar de contatos do dia no topo, fila de clientes com botões grandes de contato */
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#14223a; --muted:#5b6778; --line:#dde3ea; --soft:#e9eef4;
  --navy:#1d4a73; --navy-ink:#fff; --call:#1f7ae0; --wpp:#1fa855; --resp:#7b4bd6; --na:#8a94a3;
  --hot:#d9482b; --warm:#c98a0b; --cold:#3c7fb8; --lost:#8a94a3; --late:#c0392b; --tip-bg:#fff6dc; --tip-ink:#6b4e00;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --surface:#16212f; --ink:#e6ecf3; --muted:#9aa7b7; --line:#283648; --soft:#1d2b3c;
  --navy:#2a6299; --call:#4b9bf5; --wpp:#33c46c; --resp:#a07cf0; --na:#7d8796;
  --hot:#f06a4c; --warm:#e0a73a; --cold:#6aa6dc; --lost:#7d8796; --late:#ef6a5a; --tip-bg:#33290f; --tip-ink:#f3d58a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--call);outline-offset:2px}
header{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.hd{max-width:1000px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
.hd .l1{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font:700 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;font:500 13px var(--f-body);opacity:.8;text-transform:none;letter-spacing:0;margin-top:3px}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score .of{opacity:.8;font-size:14px}
.meter{flex:1 1 200px;height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:#7fe0a6;transition:width .3s}
.goal input{width:54px;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--navy-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn.x{background:#fff;color:#14223a;border-color:#fff}
main{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:4px}
.meta{color:var(--muted);font-size:13px;margin:10px 0}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:6px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.ok{border-color:var(--wpp)}
.stripe.Quente{background:var(--hot)}.stripe.Morno{background:var(--warm)}.stripe.Frio{background:var(--cold)}.stripe.Perdido{background:var(--lost)}
.body{padding:12px 14px;display:grid;gap:8px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.nm{font-weight:600;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.tag.today{color:var(--call);border-color:var(--call)}
.tag.late{color:var(--late);border-color:var(--late)}
.tag.done{color:var(--wpp);border-color:var(--wpp)}
.tel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tel a{color:var(--call);font-weight:500}
.tel .none{color:var(--muted);font-style:italic}
.obs{font-size:14px}
.obs b,.tip b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.tip{background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:7px 10px;font-size:14px}
.tip b{color:inherit;opacity:.8}
.next{font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;min-height:42px}
.act svg{width:18px;height:18px}
.act.lig{color:var(--call)}.act.wpp{color:var(--wpp)}.act.resp{color:var(--resp)}.act.na{color:var(--na)}
.act[aria-pressed="true"].lig{background:var(--call);border-color:var(--call);color:#fff}
.act[aria-pressed="true"].wpp{background:var(--wpp);border-color:var(--wpp);color:#fff}
.act[aria-pressed="true"].resp{background:var(--resp);border-color:var(--resp);color:#fff}
.act[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:#fff}
.gate{max-width:380px;margin:12vh auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px}
.gate h1{font:700 28px var(--f-display);text-transform:uppercase;margin:0}
.gate input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.gate .err{color:var(--late);font-size:14px;min-height:1em}
.gate label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{color:var(--muted);padding:12px 2px}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h1>Carteira ZFF</h1>
  <form id="gForm" style="display:grid;gap:10px">
    <input type="password" id="gPass" placeholder="Senha" autocomplete="current-password" required>
    <label><input type="checkbox" id="gKeep" checked> Lembrar neste aparelho</label>
    <button class="btn primary" type="submit">Entrar</button>
    <div class="err" id="gErr"></div>
  </form>
</div>

<div id="app" hidden>
<header>
  <div class="hd">
    <div class="l1">
      <div class="brand">Carteira ZFF<small id="hoje"></small></div>
      <button class="btn x" id="xlsx">Baixar planilha (.xlsx)</button>
    </div>
    <div class="score">
      <b id="nCont">0</b><span class="of">contatados hoje · meta <span class="goal"><input type="number" min="1" id="meta" aria-label="Meta de contatos do dia"></span></span>
      <div class="meter" aria-hidden="true"><i id="bar" style="width:0"></i></div>
      <span class="of" id="nResp"></span>
    </div>
  </div>
</header>
<main>
  <div class="tools"><input type="search" id="q" placeholder="Buscar nome, observação, região…"></div>
  <div class="chips" id="fil"></div>
  <div class="chips" id="temps"></div>
  <p class="meta" id="info"></p>
  <div class="list" id="list"></div>
</main>
</div>

<script>
const CAD={inbound:{nome:"Inbound",steps:[[1,"manhã","lig"],[1,"manhã","wpp"],[1,"tarde","lig"],[2,"tarde","wpp"],[4,"tarde","lig"],[4,"tarde","wpp"],[5,"noite","wpp"]]},
  repique:{nome:"Repique",steps:[[1,"manhã","wpp"],[2,"manhã","lig"],[2,"tarde","lig"],[3,"noite","wpp"],[4,"tarde","lig"],[4,"noite","wpp"]]}};
const IC={lig:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
 wpp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.6-.1 1.1z"/></svg>',
 resp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm3 5v2h10V9zm0 4v2h7v-2z"/></svg>',
 na:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 13.6L15.6 17 12 13.4 8.4 17 7 15.6 10.6 12 7 8.4 8.4 7 12 10.6 15.6 7 17 8.4 13.4 12z"/></svg>'};
const ACTS=[["lig","Liguei"],["wpp","WhatsApp"],["resp","Respondeu"],["na","Não atendeu"]];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const br=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const HOJE=iso(new Date());
let DATA=null,FIL=LS.get("fil","acontatar"),TEMP="";
let LOG=LS.get("log",{}); // {data:{id:{lig,wpp,resp,na}}}
const today=()=>LOG[HOJE]||(LOG[HOJE]={});
const contacted=id=>{const t=today()[id];return !!(t&&(t.lig||t.wpp||t.resp||t.na))};

function cadHoje(c){
  const cad=CAD[c.tipo]; if(!cad||!c.cadInicio) return [];
  return cad.steps.filter(([d])=>addDays(c.cadInicio,d-1)===HOJE).map(([d,p,t])=>({d,p,t}));
}
function dueHoje(c){return (c.proxAcao&&c.proxData&&c.proxData<=HOJE)||cadHoje(c).length>0}

function counts(){
  const cs=DATA.clientes.filter(c=>c.temp!=="Perdido");
  return {todos:DATA.clientes.length,acontatar:cs.filter(c=>!contacted(c.id)).length,
    hoje:cs.filter(c=>dueHoje(c)).length,feitos:DATA.clientes.filter(c=>contacted(c.id)).length};
}
function renderTop(){
  const n=DATA.clientes.filter(c=>contacted(c.id)).length, meta=Number(LS.get("meta",30))||30;
  const r=DATA.clientes.filter(c=>today()[c.id]?.resp).length;
  $("#nCont").textContent=n; $("#meta").value=meta;
  $("#bar").style.width=Math.min(100,n/meta*100)+"%";
  $("#nResp").textContent=r?`${r} responderam`:"";
}
function renderChips(){
  const k=counts();
  const F=[["acontatar","A contatar hoje",k.acontatar],["hoje","Agenda de hoje",k.hoje],["feitos","Já contatados",k.feitos],["todos","Todos",k.todos]];
  $("#fil").innerHTML=F.map(([v,l,n])=>`<button class="chip" data-f="${v}" aria-pressed="${FIL===v}">${l}<span class="n">${n}</span></button>`).join("");
  $("#temps").innerHTML=["","Quente","Morno","Frio","Perdido"].map(t=>`<button class="chip" data-t="${t}" aria-pressed="${TEMP===t}">${t||"Todas as temperaturas"}</button>`).join("");
}
function card(c){
  const t=today()[c.id]||{}, ok=contacted(c.id), ch=cadHoje(c);
  const late=c.proxData&&c.proxData<HOJE;
  const telN=(c.tel||"").replace(/\D/g,"");
  const wa=telN?`https://wa.me/${telN.length<=11?"55"+telN:telN}`:"";
  const tags=[ok?'<span class="tag done">contatado hoje</span>':"",
    ch.length?`<span class="tag today">${CAD[c.tipo].nome} dia ${ch[0].d}: ${ch.map(s=>(s.t==="lig"?"ligar ":"WhatsApp ")+s.p).join(" + ")}</span>`:"",
    c.proxData===HOJE?'<span class="tag today">ação hoje</span>':"",late?`<span class="tag late">ação atrasada (${br(c.proxData)})</span>`:""].join("");
  return `<article class="card${ok?" ok":""}"><span class="stripe ${esc(c.temp)}"></span><div class="body">
    <div class="top"><div><span class="nm">${esc(c.nome)}</span><span class="tag">${esc(c.temp)}</span><span class="tag">${esc(c.etapa)}</span></div><div>${tags}</div></div>
    <div class="tel">${telN?`<span>${esc(c.tel)}</span><a href="tel:+${telN.length<=11?"55"+telN:telN}">Ligar</a><a href="${wa}" target="_blank" rel="noopener">Abrir WhatsApp</a>`:'<span class="none">sem telefone cadastrado</span>'}</div>
    ${c.obs?`<div class="obs"><b>Observação</b>${esc(c.obs)}</div>`:""}
    ${c.dica?`<div class="tip"><b>Dica</b>${esc(c.dica)}</div>`:""}
    ${c.proxAcao?`<div class="next"><b>Próxima ação:</b> ${esc(c.proxAcao)}${c.proxData?` · ${br(c.proxData)}`:""}</div>`:""}
    <div class="acts">${ACTS.map(([k,l])=>`<button class="act ${k}" data-id="${c.id}" data-k="${k}" aria-pressed="${!!t[k]}">${IC[k]}${l}</button>`).join("")}</div>
  </div></article>`;
}
function render(){
  renderTop(); renderChips();
  const q=$("#q").value.trim().toLowerCase();
  let arr=DATA.clientes.filter(c=>{
    if(TEMP&&c.temp!==TEMP) return false;
    if(FIL==="acontatar"&&(contacted(c.id)||c.temp==="Perdido")) return false;
    if(FIL==="hoje"&&!(dueHoje(c)&&c.temp!=="Perdido")) return false;
    if(FIL==="feitos"&&!contacted(c.id)) return false;
    if(q&&!JSON.stringify([c.nome,c.obs,c.dica,c.regiao,c.origem,c.faixa]).toLowerCase().includes(q)) return false;
    return true});
  const ordT={Quente:0,Morno:1,Frio:2,Perdido:3};
  arr.sort((a,b)=>(dueHoje(b)-dueHoje(a))||(ordT[a.temp]??4)-(ordT[b.temp]??4)||(a.prioridade-b.prioridade)||a.nome.localeCompare(b.nome));
  $("#info").textContent=`${arr.length} clientes nesta lista · dados de ${br(DATA.atualizado)}/${DATA.atualizado.slice(0,4)}`;
  $("#list").innerHTML=arr.length?arr.map(card).join(""):`<p class="empty">${FIL==="acontatar"?"Todo mundo já foi contatado hoje.":"Nenhum cliente nesta lista."}</p>`;
}

/* ---------- planilha ---------- */
function exportXlsx(){
  if(!window.XLSX){alert("A biblioteca da planilha não carregou. Verifique a internet.");return}
  const C={navy:"1D4A73",white:"FFFFFF",hot:"F8CBAD",warm:"FFE699",cold:"BDD7EE",lost:"D9D9D9",ok:"C6EFCE",no:"FDE2E1",tip:"FFF6DC",grey:"F3F5F8"};
  const tf={Quente:C.hot,Morno:C.warm,Frio:C.cold,Perdido:C.lost};
  const border={top:{style:"thin",color:{rgb:"D0D7DE"}},bottom:{style:"thin",color:{rgb:"D0D7DE"}},left:{style:"thin",color:{rgb:"D0D7DE"}},right:{style:"thin",color:{rgb:"D0D7DE"}}};
  const H=v=>({v,t:"s",s:{font:{bold:true,color:{rgb:C.white},name:"Arial",sz:11},fill:{fgColor:{rgb:C.navy}},alignment:{horizontal:"center",vertical:"center",wrapText:true},border}});
  const V=(v,fill,extra={})=>({v:v??"",t:typeof v==="number"?"n":"s",s:{font:{name:"Arial",sz:10,...(extra.font||{})},fill:fill?{fgColor:{rgb:fill}}:undefined,alignment:{vertical:"top",wrapText:true,...(extra.al||{})},border}});
  const sim=b=>b?"Sim":"";
  const wb=XLSX.utils.book_new();

  // Aba 1: Resumo
  const n=DATA.clientes.filter(c=>contacted(c.id)).length, meta=Number(LS.get("meta",30))||30;
  const T=k=>DATA.clientes.filter(c=>c.temp===k).length;
  const r1=[[{v:"Carteira ZFF — resumo de "+br(HOJE)+"/"+HOJE.slice(0,4),t:"s",s:{font:{bold:true,sz:16,name:"Arial",color:{rgb:C.navy}}}}],[],
    [H("Indicador"),H("Valor")],
    [V("Contatados hoje"),V(n,C.ok,{font:{bold:true}})],[V("Meta do dia"),V(meta)],
    [V("Responderam hoje"),V(DATA.clientes.filter(c=>today()[c.id]?.resp).length)],
    [V("Ligações feitas"),V(DATA.clientes.filter(c=>today()[c.id]?.lig).length)],
    [V("WhatsApps enviados"),V(DATA.clientes.filter(c=>today()[c.id]?.wpp).length)],
    [V("Não atenderam"),V(DATA.clientes.filter(c=>today()[c.id]?.na).length)],
    [V("Faltam contatar (ativos)"),V(DATA.clientes.filter(c=>c.temp!=="Perdido"&&!contacted(c.id)).length,C.no)],[],
    [H("Temperatura"),H("Clientes")],
    ...["Quente","Morno","Frio","Perdido"].map(k=>[V(k,tf[k],{font:{bold:true}}),V(T(k))])];
  const ws1=XLSX.utils.aoa_to_sheet(r1); ws1["!cols"]=[{wch:30},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws1,"Resumo");

  // Aba 2: Contatos de hoje
  const hdr=["Cliente","Telefone","Temperatura","Contatado hoje?","Ligou","WhatsApp","Respondeu","Não atendeu","Agenda de hoje","Próxima ação","Data","Dica","Observação"];
  const ordT={Quente:0,Morno:1,Frio:2,Perdido:3};
  const all=[...DATA.clientes].sort((a,b)=>(ordT[a.temp]??4)-(ordT[b.temp]??4)||a.prioridade-b.prioridade||a.nome.localeCompare(b.nome));
  const rows=[hdr.map(H),...all.map(c=>{const t=today()[c.id]||{},ok=contacted(c.id),ch=cadHoje(c);
    const ag=[ch.length?`${CAD[c.tipo].nome} dia ${ch[0].d}: `+ch.map(s=>(s.t==="lig"?"ligar ":"WhatsApp ")+s.p).join(" + "):"",c.proxData&&c.proxData<=HOJE?"ação "+(c.proxData<HOJE?"atrasada":"de hoje"):""].filter(Boolean).join(" · ");
    return [V(c.nome,null,{font:{bold:true}}),V(c.tel||""),V(c.temp,tf[c.temp],{al:{horizontal:"center"}}),V(ok?"Sim":"Não",ok?C.ok:C.no,{font:{bold:true},al:{horizontal:"center"}}),
      V(sim(t.lig),null,{al:{horizontal:"center"}}),V(sim(t.wpp),null,{al:{horizontal:"center"}}),V(sim(t.resp),null,{al:{horizontal:"center"}}),V(sim(t.na),null,{al:{horizontal:"center"}}),
      V(ag),V(c.proxAcao),V(br(c.proxData)),V(c.dica,c.dica?C.tip:null),V(c.obs)]})];
  const ws2=XLSX.utils.aoa_to_sheet(rows);
  ws2["!cols"]=[22,15,12,11,7,9,10,10,30,36,8,50,50].map(w=>({wch:w}));
  ws2["!autofilter"]={ref:`A1:M${rows.length}`}; ws2["!freeze"]={xSplit:1,ySplit:1};
  ws2["!views"]=[{state:"frozen",xSplit:1,ySplit:1}];
  XLSX.utils.book_append_sheet(wb,ws2,"Contatos de hoje");

  // Aba 3: Carteira completa
  const h3=["Cliente","Telefone","Temperatura","Etapa","Origem / produto","Faixa","Região","Última resposta","Próxima ação","Data","Dica","Observação"];
  const rows3=[h3.map(H),...all.map(c=>[V(c.nome,null,{font:{bold:true}}),V(c.tel||""),V(c.temp,tf[c.temp],{al:{horizontal:"center"}}),V(c.etapa),V(c.origem),V(c.faixa),V(c.regiao),V(br(c.ultResp)),V(c.proxAcao),V(br(c.proxData)),V(c.dica,c.dica?C.tip:null),V(c.obs)])];
  const ws3=XLSX.utils.aoa_to_sheet(rows3);
  ws3["!cols"]=[22,15,12,18,24,14,20,10,36,8,50,50].map(w=>({wch:w}));
  ws3["!autofilter"]={ref:`A1:L${rows3.length}`}; ws3["!views"]=[{state:"frozen",xSplit:1,ySplit:1}];
  XLSX.utils.book_append_sheet(wb,ws3,"Carteira");

  XLSX.writeFile(wb,`Carteira ZFF ${HOJE}.xlsx`);
}

/* ---------- dados (criptografados no site publicado) ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,senha){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function start(d){DATA=d;$("#gate").hidden=true;$("#app").hidden=false;render()}
(async()=>{
  let enc=null;
  try{const r=await fetch("data.enc.json",{cache:"no-store"}); if(r.ok) enc=await r.json()}catch(e){}
  if(!enc){try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok){start(await r.json());return}}catch(e){}
    document.body.innerHTML='<p class="empty" style="padding:24px">Não encontrei os dados da carteira.</p>';return}
  const saved=LS.get("k","");
  if(saved){try{start(await decrypt(enc,saved));return}catch(e){LS.set("k","")}}
  $("#gate").hidden=false;$("#gPass").focus();
  $("#gForm").addEventListener("submit",async ev=>{ev.preventDefault();const s=$("#gPass").value;
    try{const d=await decrypt(enc,s);if($("#gKeep").checked)LS.set("k",s);start(d)}catch(err){$("#gErr").textContent="Senha incorreta."}});
})();
</script>
