<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Novos Lançamentos · ZFF</title>
<meta name="description" content="Todos os lançamentos de Campinas e região, com filtros, book, vídeos, tabela e fluxo — para os corretores da ZFF Realty.">
<link rel="icon" href="assets/zff-logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#1b1d22; --panel:#25282f; --panel-2:#2c3038; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --text:#eef0f3; --muted:#9aa1ab; --accent:#ec7a35; --accent-soft:rgba(236,122,53,.14); --accent-text:#f39a62;
  --ok:#5cc28a; --ok-soft:rgba(92,194,138,.13); --warn:#e0a83a; --warn-soft:rgba(224,168,58,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  --r:16px; --maxw:1240px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.brand b{font:600 20px/1 Oswald,sans-serif;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line-strong);background:var(--panel);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.iconbtn:hover{border-color:var(--accent)}

/* Hero */
.hero{padding:28px 0 8px}
.hero h1{font:600 clamp(28px,4.6vw,44px)/1.05 Oswald,sans-serif;text-transform:uppercase;margin:0;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:680px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:600 24px/1.1 Oswald,sans-serif}
.stat span{font-size:12px;color:var(--muted)}

/* Filters */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:16px 0;box-shadow:var(--shadow)}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.frow + .frow{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line-strong);border-radius:11px;background:var(--bg);padding:0 12px 0 38px}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
select{height:42px;border:1px solid var(--line-strong);border-radius:11px;background:var(--bg);padding:0 10px;max-width:100%}
.flabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.resbar .count{font-weight:700}
.resbar .count small{color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.linkbtn{background:none;border:0;color:var(--accent-text);font-weight:700;cursor:pointer;padding:4px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .car{aspect-ratio:4/3}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font:600 19px/1.15 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.card h3 a{text-decoration:none}
.card-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.card-meta span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800;margin-bottom:2px}
.card-meta .pv{font:600 20px/1.05 Oswald,sans-serif;color:var(--accent-text)}
.card-meta .ent{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.bairro{background:var(--accent-soft);color:var(--accent-text)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* Carrossel de fotos */
.car{position:relative;background:var(--panel-2);overflow:hidden}
.car-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar{display:none}
.car-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block;user-select:none;-webkit-user-drag:none}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(15,16,20,.62);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;backdrop-filter:blur(4px)}
.car-btn:hover{background:rgba(15,16,20,.85)}
.car-prev{left:8px}.car-next{right:8px}
.car:hover .car-btn,.car:focus-within .car-btn{opacity:1}
.car-btn[disabled]{opacity:0!important;pointer-events:none}
.car-count{position:absolute;right:8px;bottom:8px;background:rgba(15,16,20,.62);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
@media (hover:none){ .car-btn{opacity:1} }
.car-vazio{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#2b2f37,#1f2228 60%,#2a2420);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.car-vazio b{font:600 26px/1 Oswald,sans-serif;color:rgba(255,255,255,.14);letter-spacing:.02em;text-transform:uppercase;text-align:center;padding:0 16px}
.galeria{margin:4px 0 16px;border-radius:var(--r);border:1px solid var(--line)}
.galeria.car{aspect-ratio:16/9;max-height:72vh;width:100%}
.galeria .car-track img{object-fit:contain;background:#14161a;cursor:zoom-in}
.galeria .car-zoom{position:absolute;left:14px;bottom:12px;background:rgba(15,16,20,.62);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;pointer-events:none}
.galeria .car-btn{width:44px;height:44px;font-size:26px;opacity:.9}
.galeria .car-prev{left:14px}.galeria .car-next{right:14px}
.galeria .car-count{font-size:13px;right:14px;bottom:12px;padding:3px 10px}
@media (max-width:760px){ .galeria.car{aspect-ratio:4/3} }

.empty{padding:60px 16px;text-align:center;color:var(--muted)}

/* Filtro no topo, recolhível */
.toolbar{display:flex;gap:10px;align-items:center;margin-top:18px}
.abrir-filtros{height:42px;white-space:nowrap;flex:none}
.abrir-filtros .chev{transition:transform .2s;display:inline-block}
.abrir-filtros[aria-expanded="true"]{border-color:var(--accent)}
.abrir-filtros[aria-expanded="true"] .chev{transform:rotate(180deg)}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.badge[hidden]{display:none}
.side{display:none;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.side.open{display:block;animation:abre .18s ease}
@keyframes abre{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;align-items:end}
.fgrid .w2{grid-column:span 2}
.fc{display:flex;flex-direction:column;gap:4px;min-width:0}
.fc > .lb{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap}
.na{color:var(--warn);cursor:help;font-size:11px}
.fc select,.fc input,.ddbtn{height:34px;width:100%;min-width:0;font-size:13px;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);padding:0 8px}
.fc select.on,.ddbtn.on,.fc input.on{border-color:var(--accent);color:var(--accent-text)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.mini .chip{padding:0;height:34px;border-radius:9px;font-size:13px}
.dd{position:relative}
.ddbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;text-align:left}
.ddbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddpop{display:none;position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:max(100%,250px);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:8px}
.dd.open .ddpop{display:block}
.cfind{width:100%;height:32px;margin-bottom:6px;font-size:13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:0 8px}
.checklist{display:flex;flex-direction:column;gap:1px;max-height:240px;overflow-y:auto}
.checklist label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:13.5px}
.checklist label:hover{background:var(--panel)}
.checklist input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.checklist span{flex:1}
.checklist em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fact{display:none;gap:8px;justify-content:flex-end;align-items:center}
.fact .btn{height:34px;padding:0 12px;font-size:13px}
.resbar{margin-top:14px}
@media (max-width:760px){ .fgrid{grid-template-columns:1fr 1fr} .fc:has(> .dd){grid-column:1/-1} .fact{grid-column:1/-1;display:flex} .fact .btn.primary{flex:1;justify-content:center} }

/* Detail page */
.back{display:inline-flex;align-items:center;gap:6px;margin:20px 0 10px;font-weight:700;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--accent-text)}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px}
.dhead h1{font:600 clamp(30px,5vw,48px)/1 Oswald,sans-serif;text-transform:uppercase;margin:6px 0 6px}
.dhead .by{color:var(--muted)}
.dprice{text-align:right}
.dprice b{display:block;font:600 32px/1 Oswald,sans-serif;color:var(--accent-text)}
.dprice small{color:var(--muted);font-size:12px}
.clink{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.clink .btn{padding:8px 12px;font-size:13px}
@media (max-width:760px){ .clink{justify-content:flex-start} }
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);overflow-x:auto;scrollbar-width:none;position:sticky;top:62px;background:var(--bg);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.tab .dot.on{background:var(--ok)}
.panel{padding:20px 0 50px}
.endereco{margin:0 0 14px;color:var(--muted)}
.mapa{display:block;width:100%;height:340px;border:0;border-radius:12px;margin:0 0 18px;background:#2c3038}
@media (max-width:760px){ .mapa{height:260px} }

.endereco a{color:var(--accent-text);font-weight:700}
.sobre{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.sobre h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0;font-weight:600}
.lazer{margin:0;padding:0;list-style:none;columns:2;column-gap:18px;font-size:14px}
.lazer li{padding:3px 0 3px 16px;position:relative;break-inside:avoid}
.lazer li::before{content:"";position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
@media (max-width:760px){ .sobre{grid-template-columns:1fr} .lazer{columns:1} }
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.dgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px 18px}
.facts div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:2px}
.facts div b{font-size:16px}
.box h3{margin:0 0 12px;font:600 16px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em}
.ptable{width:100%;min-width:0;font-size:14px}
.ptable td{padding:8px 4px}
.ptable td:last-child{text-align:right;font-weight:700}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.media{display:flex;flex-direction:column;gap:16px}
.mitem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mitem .mbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mitem .mbar b{font-size:14px}
.mitem .mbar .actions{margin:0}
.mitem .mbar .btn{padding:7px 11px;font-size:13px}
.mitem iframe,.mitem video{display:block;width:100%;border:0;background:#000}
.mitem iframe.doc{height:min(80vh,900px);background:var(--panel-2)}
.mitem .vid{aspect-ratio:16/9;height:auto}
.mitem img{display:block;width:100%;height:auto}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.vazio{text-align:center;padding:50px 20px;border:2px dashed var(--line-strong);border-radius:var(--r);color:var(--muted)}
.vazio b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.vazio code{background:var(--panel-2);padding:2px 6px;border-radius:6px;font-size:12.5px;color:var(--text)}
footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--muted);font-size:12.5px}

/* Comparador */
.cmp-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.cmp-top h1{font:600 clamp(28px,4.6vw,44px)/1.05 Oswald,sans-serif;text-transform:uppercase;margin:6px 0 4px}
.cmp-top p{color:var(--muted);margin:0;max-width:720px}
.cmp-add{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-bottom:14px}
.cmp-add label,.cmp-meta label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cmp-add .in{display:flex;gap:6px}
.cmp input,.cmp textarea,.cmp-add input,.cmp-meta input{width:100%;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;font:500 14px/1.35 Manrope,sans-serif;color:var(--text);text-transform:none;letter-spacing:0}
.cmp textarea{resize:vertical;min-height:40px}
.cmp input:focus,.cmp textarea:focus,.cmp-add input:focus,.cmp-meta input:focus{outline:none;border-color:var(--accent)}
.cmp-meta{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.cmp{display:grid;grid-template-columns:repeat(var(--n),minmax(260px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start}
.cmp-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.cmp-col .car{aspect-ratio:16/10}
.cmp-col .car-track img{object-fit:cover}
.cmp-h{display:flex;gap:6px;align-items:center;padding:12px 12px 0}
.cmp-h .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:600 13px/1 Oswald,sans-serif}
.cmp .cmp-h input{font:600 17px/1.2 Oswald,sans-serif;text-transform:uppercase}
.cmp-h button{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--panel-2);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted)}
.cmp-h button:hover{color:var(--text);border-color:var(--accent)}
.cmp-src{padding:6px 12px 0;font-size:12px;color:var(--muted)}
.cmp-src .lendo{color:var(--accent-text);animation:pisca 1.4s ease-in-out infinite}
@keyframes pisca{50%{opacity:.45}}
.cmp-f{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
.cmp-f h4{margin:10px 0 0;font:600 13px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text)}
.cmp-f label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.cmp-det{border-top:1px solid var(--line);margin-top:10px}
.cmp-det summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-weight:700;font-size:13.5px;list-style:none}
.cmp-det summary::-webkit-details-marker{display:none}
.cmp-det summary span::before{content:"▸ ";color:var(--muted)}
.cmp-det[open] summary span::before{content:"▾ "}
.cmp-det summary b{font-size:12px;padding:2px 8px;border-radius:999px}
.cmp-det summary .falta{background:var(--warn-soft);color:var(--warn)}
.cmp-det summary .ok{background:var(--ok-soft);color:var(--ok)}
.cmp-f .obr{color:var(--accent-text);font-style:normal}
.cmp .erro{border-color:var(--warn) !important;box-shadow:0 0 0 2px var(--warn-soft)}
.cmp-vazio{grid-column:1/-1;text-align:center;padding:46px 16px;border:2px dashed var(--line-strong);border-radius:var(--r);color:var(--muted)}
.cmp-vazio b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.cmp-go{position:sticky;bottom:0;z-index:8;margin:16px -16px 0;padding:12px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmp-go .msg{color:var(--muted);font-size:13px;flex:1;min-width:200px}

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <img src="assets/zff-logo.jpeg" alt="ZFF Realty">
      <div><b>Novos Lançamentos</b><span>Campinas e região · ZFF Realty</span></div>
    </a>
    <div class="sp"></div>
    <a class="iconbtn" href="https://captacao-zff.zff-captacao.workers.dev/" target="_blank" rel="noopener" title="Gerar página de captação para o cliente">＋ Captação</a>
    <a class="iconbtn" href="#/comparar" title="Comparar empreendimentos">⇄ Comparar <span class="badge" id="cmpn" hidden></span></a>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">
    Uso interno dos corretores ZFF Realty. Fonte: <i>Lançamentos Campinas 2026 — atualizado</i> (<span id="upd"></span>). Preços médios de referência — sempre confirmar valores, disponibilidade e prazos com a construtora antes de passar ao cliente.
  </div>
</footer>

<script src="dados.js?v=ea2dc686"></script>
<script src="materiais.js?v=4ab4a016"></script>
<script src="links.js?v=c90126ed"></script>
<script src="galeria.js?v=dade6568"></script>
<script>
(() => {
"use strict";
const DATA = (window.LANCAMENTOS || []);
const MAT = (window.MATERIAIS || {});
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

$("#upd").textContent = window.ATUALIZADO_EM || "";

/* ---------- formatting ---------- */
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const now = new Date(); const NOW_KEY = now.getFullYear() * 100 + (now.getMonth() + 1);
function money(v){
  if (v == null) return "Esgotado";
  if (v >= 1000) return "R$ " + (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi";
  return "R$ " + v.toLocaleString("pt-BR") + " mil";
}
function entregaKey(l){ if (l.e === "pronto") return 0; const [y, m] = l.e.split("-").map(Number); return y * 100 + m; }
const MESES_EXT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function entregaLonga(l){
  if (l.e === "pronto") return "Pronto";
  if (l.el) return l.el + " (mês não informado)";
  const [y, m] = l.e.split("-").map(Number); return MESES_EXT[m - 1] + " de " + y;
}
function entregaLabel(l){
  if (l.e === "pronto") return "Pronto";
  if (l.el) return l.el;
  const [y, m] = l.e.split("-").map(Number); return MESES[m - 1] + "/" + y;
}
function entregaVencida(l){ return l.e !== "pronto" && entregaKey(l) < NOW_KEY; }
const nm = x => x.toLocaleString("pt-BR");
function m2Label(l){ const m = l.m.map(nm); return m.length === 1 ? m[0] + " m²" : m.slice(0, -1).join(", ") + " e " + m[m.length - 1] + " m²"; }
function m2Range(l){ return Math.min(...l.m) === Math.max(...l.m) ? nm(l.m[0]) + " m²" : nm(Math.min(...l.m)) + "–" + nm(Math.max(...l.m)) + " m²"; }
function dormLabel(l){
  if (!l.d) return l.tip || "—";
  const w = l.su ? "suíte" : "dorm";
  const [a, b] = l.d; return (a === b ? a : a + " e " + b) + " " + w + (b > 1 ? "s" : "");
}
function precosValidos(l){ return l.p.map(x => x[1]).filter(v => v != null); }
function precoMin(l){ const v = precosValidos(l); return v.length ? Math.min(...v) : null; }
function precoMax(l){ const v = precosValidos(l); return v.length ? Math.max(...v) : null; }
function precoLabel(l){
  const a = precoMin(l), b = precoMax(l);
  if (!l.p.length) return "Sob consulta";
  if (a == null) return "Esgotado";
  return a === b ? money(a) : money(a) + " a " + money(b);
}
const VIS = {
  stand_dec: { t: "Stand e decorado", cls: "ok" },
  stand:     { t: "Só stand (sem decorado)", cls: "" },
  torre:     { t: "Decorado na torre", cls: "ok" },
  imovel:    { t: "Visita no imóvel", cls: "ok" },
  dec:       { t: "Tem decorado", cls: "ok" },
  virtual:   { t: "Stand + decorado virtual", cls: "" },
  nenhum:    { t: "Sem stand nem decorado", cls: "warn" },
};
const visLabel = l => l.vo || VIS[l.vis].t;
const TIPO = { apto: "Apartamento", casa: "Casa" };

/* ---------- materials ---------- */
const TABS = [
  { k: "resumo", t: "Resumo" },
  { k: "book",   t: "Book" },
  { k: "videos", t: "Vídeos" },
  { k: "tabela", t: "Tabela" },
  { k: "fluxo",  t: "Fluxo de pagamento" },
];
function matList(l, k){
  const raw = (MAT[l.slug] || {})[k];
  if (!raw) return [];
  return (Array.isArray(raw) ? raw : [raw]).filter(Boolean).map((x, i) => typeof x === "string" ? { url: x, titulo: "" } : { url: x.url, titulo: x.titulo || "" });
}
const hasMat = (l, k) => matList(l, k).length > 0;

function mediaKind(url){
  const u = url.toLowerCase();
  if (/youtu\.be\/|youtube\.com\//.test(u)) return "youtube";
  if (/vimeo\.com\//.test(u)) return "vimeo";
  if (/drive\.google\.com\//.test(u)) return "drive";
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/.test(u)) return "video";
  if (/\.(png|jpe?g|webp|gif)(\?|#|$)/.test(u)) return "image";
  if (/\.pdf(\?|#|$)/.test(u)) return "pdf";
  return "link";
}
function embedUrl(url, kind){
  if (kind === "youtube"){
    const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{6,})/);
    return m ? "https://www.youtube-nocookie.com/embed/" + m[1] : url;
  }
  if (kind === "vimeo"){ const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/); return m ? "https://player.vimeo.com/video/" + m[1] : url; }
  if (kind === "drive"){
    const m = url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
    return m ? "https://drive.google.com/file/d/" + m[1] + "/preview" : url;
  }
  return url;
}
function mediaHTML(item, idx, tabKey, l){
  const kind = mediaKind(item.url);
  const nome = item.titulo || (TABS.find(t => t.k === tabKey).t + (idx ? " " + (idx + 1) : ""));
  const isVid = tabKey === "videos";
  let body;
  if (kind === "image") body = `<img src="${esc(item.url)}" alt="${esc(nome)} — ${esc(l.n)}" loading="lazy">`;
  else if (kind === "video") body = `<video class="vid" src="${esc(item.url)}" controls preload="metadata"></video>`;
  else if (kind === "youtube" || kind === "vimeo") body = `<iframe class="vid" src="${esc(embedUrl(item.url, kind))}" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="${esc(nome)}"></iframe>`;
  else if (kind === "drive") body = `<iframe class="${isVid ? "vid" : "doc"}" src="${esc(embedUrl(item.url, kind))}" allow="fullscreen" allowfullscreen loading="lazy" title="${esc(nome)}"></iframe>`;
  else if (kind === "pdf") body = `<iframe class="doc" src="${esc(item.url)}#view=FitH" loading="lazy" title="${esc(nome)}"></iframe>`;
  else body = `<div class="vazio" style="border:0"><b>Link externo</b>Abra pelo botão acima.</div>`;
  const dlUrl = /workers\.dev\//.test(item.url) ? item.url + (item.url.includes("?") ? "&" : "?") + "baixar=1" : item.url;
  const dl = (kind === "pdf" || kind === "image" || kind === "video") ? `<a class="btn" href="${esc(dlUrl)}" download>⬇ Baixar</a>` : "";
  return `<div class="mitem">
    <div class="mbar"><b>${esc(nome)}</b>
      <div class="actions"><a class="btn" href="${esc(item.url)}" target="_blank" rel="noopener">↗ Abrir em nova aba</a>${dl}</div>
    </div>${body}</div>`;
}

/* ---------- enrich data ---------- */
function parseVagas(v){
  if (!v) return null;
  const n = (v.match(/\d+/g) || []).map(Number);
  if (/\d+\s*a\s*\d+/.test(v) && n.length >= 2){ const r = []; for (let i = n[0]; i <= n[1]; i++) r.push(i); return r; }
  if (/até/i.test(v)) return [0, ...n];
  return n.length ? n : null;
}
const temSuite = l => l.suite != null ? l.suite : (l.su ? true : null);
DATA.forEach(l => {
  l.slug = slugify(l.n);
  l._q = norm([l.n, l.c, l.b, TIPO[l.t], l.tip || "", l.obs || "", l.end || ""].join(" "));
  l._vg = parseVagas(l.v);
});
const BY_SLUG = Object.fromEntries(DATA.map(l => [l.slug, l]));
const BAIRROS = [...new Set(DATA.map(l => l.b))].sort((a, b) => a.localeCompare(b, "pt-BR"));
const CONSTRUTORAS = [...new Set(DATA.map(l => l.c))].sort((a, b) => a.localeCompare(b, "pt-BR"));

/* ---------- semesters ---------- */
const semKey = l => { if (l.e === "pronto") return 0; const [y, m] = l.e.split("-").map(Number); return y * 10 + (m <= 6 ? 1 : 2); };
const semLabel = k => k === 0 ? "Pronto" : (k % 10) + "º sem/" + Math.floor(k / 10);
const SEMS = [...new Set(DATA.map(semKey))].sort((a, b) => a - b);

/* ---------- filter state (synced to URL query) ---------- */
const DEF = {
  q: "", bairro: [], pmin: "", pmax: "", sde: "", sate: "", dorms: [], vagas: [], vc: "", fgts: "",
  mmin: "", mmax: "", inv: "", c: [], tipo: "", suite: "", mat: false, pend: "", ord: "preco",
};
let F = loadState();
function loadState(){
  const s = JSON.parse(JSON.stringify(DEF));
  const h = location.hash.split("?")[1]; if (!h) return s;
  const p = new URLSearchParams(h);
  for (const k of Object.keys(DEF)){
    if (!p.has(k)) continue;
    const v = p.get(k);
    if (Array.isArray(DEF[k])) s[k] = v ? v.split("|") : [];
    else if (typeof DEF[k] === "boolean") s[k] = v === "1";
    else s[k] = v;
  }
  return s;
}
function stateQuery(){
  const p = new URLSearchParams();
  for (const k of Object.keys(DEF)){
    const v = F[k], d = DEF[k];
    if (Array.isArray(d)){ if (v.length) p.set(k, v.join("|")); }
    else if (typeof d === "boolean"){ if (v) p.set(k, "1"); }
    else if (v !== d) p.set(k, v);
  }
  const s = p.toString(); return s ? "?" + s : "";
}
function syncUrl(){ history.replaceState(null, "", "#/" + stateQuery()); }
const ativos = () => ["bairro","dorms","vagas","c"].filter(k => F[k].length).length
  + ["vc","fgts","inv","tipo","suite","pend"].filter(k => F[k]).length
  + (F.pmin || F.pmax ? 1 : 0) + (F.sde || F.sate ? 1 : 0) + (F.mmin || F.mmax ? 1 : 0) + (F.mat ? 1 : 0);

const PRECO_OPTS = [250,300,350,400,450,500,550,600,700,800,900,1000,1200,1400,1600,1800,2000,2500,3000,4000,5000,7000];
const triMatch = (val, f) => !f || (f === "sim" ? val === true : val === false);

function passa(l, skip){
  const sk = k => skip === k;
  if (F.q){ const terms = norm(F.q).split(/\s+/).filter(Boolean); if (!terms.every(t => l._q.includes(t))) return false; }
  if (!sk("bairro") && F.bairro.length && !F.bairro.includes(l.b)) return false;
  const pmn = precoMin(l), pmx = precoMax(l);
  if (F.pmin && (pmx == null || pmx < +F.pmin)) return false;
  if (F.pmax && (pmn == null || pmn > +F.pmax)) return false;
  const sk2 = semKey(l);
  if (F.sde !== "" && sk2 < +F.sde) return false;
  if (F.sate !== "" && sk2 > +F.sate) return false;
  if (!sk("dorms") && F.dorms.length){
    if (!l.d) return false;
    const [a, b] = l.d;
    if (!F.dorms.some(d => d === "4" ? b >= 4 : (+d >= a && +d <= b))) return false;
  }
  if (!sk("vagas") && F.vagas.length){
    if (!l._vg) return false;
    if (!F.vagas.some(v => v === "4" ? l._vg.some(x => x >= 4) : l._vg.includes(+v))) return false;
  }
  if (F.vc && !(l.vc === F.vc || l.vc === "ambas")) return false;
  if (!triMatch(l.fgts, F.fgts)) return false;
  if (F.mmin && Math.max(...l.m) < +F.mmin) return false;
  if (F.mmax && Math.min(...l.m) > +F.mmax) return false;
  if (!triMatch(l.inv, F.inv)) return false;
  if (!sk("c") && F.c.length && !F.c.includes(l.c)) return false;
  if (F.tipo && l.t !== F.tipo) return false;
  if (!triMatch(temSuite(l), F.suite)) return false;
  if (F.mat && !TABS.slice(1).some(t => hasMat(l, t.k))) return false;
  if (F.pend){
    const b = hasMat(l, "book"), t = hasMat(l, "tabela");
    if (F.pend === "completo" && !(b && t)) return false;
    if (F.pend === "pendente" && b && t) return false;
    if (F.pend === "book" && b) return false;
    if (F.pend === "tabela" && t) return false;
  }
  return true;
}
const ORD = {
  preco:  (a, b) => (precoMin(a) ?? 1e9) - (precoMin(b) ?? 1e9),
  precod: (a, b) => (precoMin(b) ?? -1) - (precoMin(a) ?? -1),
  entrega:(a, b) => entregaKey(a) - entregaKey(b),
  m2:     (a, b) => Math.max(...b.m) - Math.max(...a.m),
  nome:   (a, b) => a.n.localeCompare(b.n, "pt-BR"),
  bairro: (a, b) => a.b.localeCompare(b.b, "pt-BR") || a.n.localeCompare(b.n, "pt-BR"),
};

/* ---------- list view ---------- */
function chips(name, opts, multi = true){
  return `<div class="chips" data-chips="${name}">` + opts.map(([v, t]) => {
    const on = multi ? F[name].includes(v) : F[name] === v;
    return `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${on}">${esc(t)}</button>`;
  }).join("") + `</div>`;
}
function opt(v, t, cur){ return `<option value="${esc(v)}"${String(cur) === String(v) ? " selected" : ""}>${esc(t)}</option>`; }
function semInfo(field){
  const n = DATA.filter(l => (field === "suite" ? temSuite(l) : l[field]) == null).length;
  return n ? `<span class="na" title="${n} de ${DATA.length} empreendimentos ainda sem essa informação — eles não aparecem quando o filtro está ativo">ⓘ</span>` : "";
}
function checklist(name, values){
  return `<div class="checklist" data-check="${name}">` + values.map(v =>
    `<label><input type="checkbox" value="${esc(v)}"${F[name].includes(v) ? " checked" : ""}><span>${esc(v)}</span><em data-cnt="${esc(v)}"></em></label>`
  ).join("") + `</div>`;
}
function dd(name, values, busca){
  return `<div class="dd" data-dd="${name}"><button type="button" class="ddbtn" aria-haspopup="true"><span></span>▾</button>
    <div class="ddpop">${busca ? `<input class="cfind" type="search" placeholder="${busca}" aria-label="${busca}">` : ""}${checklist(name, values)}</div></div>`;
}
function mini(name){
  return `<div class="mini" data-chips="${name}">` + [["1","1"],["2","2"],["3","3"],["4","4+"]].map(([v, t]) =>
    `<button type="button" class="chip" data-v="${v}" aria-pressed="${F[name].includes(v)}">${t}</button>`).join("") + `</div>`;
}
const fc = (titulo, corpo, extra = "", cls = "") => `<div class="fc ${cls}"><span class="lb">${titulo}${extra}</span>${corpo}</div>`;
const sel = (id, label, opts) => `<select id="${id}" aria-label="${label}">${opts.map(([v, t]) => opt(v, t, F[id])).join("")}</select>`;
const TRI = [["","Todos"],["sim","Sim"],["nao","Não"]];
function pendInfo(){
  const n = DATA.filter(l => !(hasMat(l, "book") && hasMat(l, "tabela"))).length;
  return n ? `<span class="na" title="${n} de ${DATA.length} empreendimentos ainda sem book e/ou tabela (obrigatórios)">${n}</span>` : "";
}

function renderList(){
  document.title = "Novos Lançamentos · ZFF";
  const precos = DATA.map(precoMin).filter(v => v != null);
  $("#app").innerHTML = `
  <section class="hero">
    <h1>Lançamentos <em>Campinas</em> 2026</h1>
    <p>Todos os empreendimentos da região num só lugar. Filtre pelo perfil do cliente e abra o projeto para ver book, vídeos, tabela e fluxo de pagamento.</p>
  </section>
  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar empreendimento pelo nome…" value="${esc(F.q)}" aria-label="Buscar"></label>
    <button class="btn abrir-filtros" id="abrir" type="button" aria-expanded="${filtrosAbertos}" aria-controls="side">⚙ Filtros <span class="badge" id="nf"></span> <span class="chev">▾</span></button>
  </div>
    <aside class="side${filtrosAbertos ? " open" : ""}" id="side" aria-label="Filtros">
      <div class="fgrid">
        ${fc("Bairro", dd("bairro", BAIRROS, "Digite o bairro…"))}
        ${fc("Valor", `<div class="pair"><select id="pmin" aria-label="Valor de">${opt("", "De", F.pmin)}${PRECO_OPTS.map(v => opt(v, money(v), F.pmin)).join("")}</select><select id="pmax" aria-label="Valor até">${opt("", "Até", F.pmax)}${PRECO_OPTS.map(v => opt(v, money(v), F.pmax)).join("")}</select></div>`, "", "w2")}
        ${fc("Entrega", `<div class="pair"><select id="sde" aria-label="Entrega de">${opt("", "De", F.sde)}${SEMS.map(k => opt(k, semLabel(k), F.sde)).join("")}</select><select id="sate" aria-label="Entrega até">${opt("", "Até", F.sate)}${SEMS.map(k => opt(k, semLabel(k), F.sate)).join("")}</select></div>`, "", "w2")}
        ${fc("Quartos", mini("dorms"))}
        ${fc("Vagas", mini("vagas"))}
        ${fc("Vaga coberta", sel("vc", "Vaga coberta", [["","Todas"],["coberta","Coberta"],["descoberta","Descoberta"]]), semInfo("vc"))}
        ${fc("Metragem m²", `<div class="pair"><input id="mmin" type="number" inputmode="numeric" min="0" placeholder="De" value="${esc(F.mmin)}" aria-label="Metragem de"><input id="mmax" type="number" inputmode="numeric" min="0" placeholder="Até" value="${esc(F.mmax)}" aria-label="Metragem até"></div>`)}
        ${fc("FGTS entrada", sel("fgts", "Aceita FGTS na entrada", TRI), semInfo("fgts"))}
        ${fc("Investimento", sel("inv", "Ótimo para investimento", TRI), semInfo("inv"))}
        ${fc("Construtora", dd("c", CONSTRUTORAS, "Buscar construtora…"))}
        ${fc("Casa ou apartamento", sel("tipo", "Casa ou apartamento", [["","Todos"],["apto","Apartamento"],["casa","Casa"]]))}
        ${fc("Suíte", sel("suite", "Tem suíte", TRI), semInfo("suite"))}
        ${fc("Pendências", sel("pend", "Pendências de material", [["","Todos"],["pendente","Falta book ou tabela"],["book","Falta book"],["tabela","Falta tabela"],["completo","Completo (book + tabela)"]]), pendInfo())}
        <div class="fact w2"><button class="btn" id="limpar" type="button">Limpar</button><button class="btn primary" id="ver" type="button"></button></div>
      </div>
    </aside>
      <div class="resbar">
        <div class="count" id="count"></div>
        <div class="fgroup">
          <select id="ord" aria-label="Ordenar">
            ${[["preco","Menor preço"],["precod","Maior preço"],["entrega","Entrega mais próxima"],["m2","Maior metragem"],["bairro","Bairro"],["nome","Nome (A–Z)"]].map(([v,t]) => opt(v, "Ordenar: " + t, F.ord)).join("")}
          </select>
        </div>
      </div>
  <div id="results"></div>`;

  const upd = () => { syncUrl(); renderResults(); };
  $("#q").addEventListener("input", e => { F.q = e.target.value; upd(); });
  for (const id of ["pmin","pmax","sde","sate","ord","vc","fgts","inv","tipo","suite","pend"]) $("#" + id).addEventListener("change", e => { F[id] = e.target.value; upd(); });
  for (const id of ["mmin","mmax"]) $("#" + id).addEventListener("input", e => { F[id] = e.target.value; upd(); });
  document.querySelectorAll("[data-chips]").forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const name = g.dataset.chips, v = b.dataset.v;
    if (Array.isArray(F[name])){

  let nome = d.condominio || "";
  if (!nome){
    const m = desc.join(" ").match(/\b(?:Condom[ií]nio|Edif[ií]cio|Residencial)\s+((?:[A-ZÀ-Ú0-9][\wÀ-ú'’.&-]*\s?){1,5})/);
    if (m && !/^(Fechado|Clube|Com)\b/.test(m[1])) nome = m[0].trim();
  }
  const pega = re => (txt.match(re) || [])[1] || "";
  const area = d.areaUtil || d.areaConstruida || d.areaTerreno;
  const vagas = d.vagas || ((d.vagasCob || 0) + (d.vagasDes || 0)) || 0;
  const varanda = txt.match(/varanda gourmet com churrasqueira|varanda gourmet|varanda grill|varanda com churrasqueira|terraco gourmet|terraco|varanda|sacada/);
  const nomeVar = { "terraco gourmet": "terraço gourmet", "terraco": "terraço" };
  // sem repetir: tira o que está contido em outro item e o que já tem campo próprio (varanda)
  const enxuga = a => uniq(a).filter((x, i, l) => !l.some((y, j) => j !== i && norm(y).length > norm(x).length && norm(y).includes(norm(x))));
  const dif = enxuga(sec.unid.filter(x => !/m²|m2|metros|pronto para morar|varanda|terra[cç]o|sacada/i.test(x))
    .concat(carac.filter(c => !CMP_LAZER.test(c) && !CMP_NAO_UNID.test(c) && !/varanda|terra[cç]o|sacada/i.test(c))));
  const lz = uniq(sec.lazer.filter(x => CMP_LAZER.test(x)).concat(carac.filter(c => CMP_LAZER.test(c) && !/^churrasqueira$|varanda/i.test(c))));
  const brl = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
  return {
    n: nome || [d.tipo || "Imóvel", d.codigo].filter(Boolean).join(" "), c: V, st: "Pronto", ent: "Pronto",
    b: [d.bairro, d.cidade && d.cidade !== "Campinas" ? d.cidade : ""].filter(Boolean).join(" - ") || V,
    end: [d.endereco, d.numero].filter(Boolean).join(", ") || V,
    ter: (pega(/(?:area (?:total )?do terreno|terreno)\s*(?:de|:)?\s*(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*m/) && pega(/(?:area (?:total )?do terreno|terreno)\s*(?:de|:)?\s*(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*m/) + " m²") || V,
    tor: (/torre unica|unica torre/.test(txt) ? "1" : pega(/\b(\d{1,2})\s*torres\b/)) || V,
    un: pega(/\b(\d{2,4})\s*(?:unidades|apartamentos)\b(?!\s*(?:por|em cada))/) || V,
    el: pega(/\b(\d{1,2})\s*elevadores?\b/) || (/\belevador/.test(txt) ? "Sim" : V),
    m2: area ? nm(area) + " m²" : V,
    dor: d.quartos ? plural(d.quartos, "dormitório") + (d.suites ? " (" + plural(d.suites, "suíte") + ")" : "") : V,
    vg: vagas ? plural(vagas, "vaga") : /sem vaga|nao possui vaga/.test(txt) ? "Sem vaga" : V,
    var: varanda ? "Sim — " + (nomeVar[varanda[0]] || varanda[0]) : V,
    dif: dif.join(" · ") || V,
    lz: lz.join("\n") || V,
    val: d.valorVenda ? brl(d.valorVenda) : V,
    cond: d.valorCondominio ? brl(d.valorCondominio) : "",
    link, ft: (d.fotos || []).slice(0, 10).map(x => base + x), _cod: d.codigo || "",
  };
}
async function cmpLer(p){
  if (cmpLendo.has(p)) return;
  cmpLendo.add(p); delete p._erro;
  try {
    const c = cmpLinkCaptacao(p.link || "");
    const r = await fetch(c.api, { cache: "no-store" }).catch(() => null);
    const d = r && await r.json().catch(() => null);
    if (!r || !r.ok || !d || d.erro) throw new Error((d && d.erro) || "Não consegui abrir essa captação.");
    for (const [k, v] of Object.entries(cmpDaCaptacao(d, c.base, p.link))) if (cmpVazio(p[k])) p[k] = v;
    p._lido = true;
  } catch(e){
    p._erro = e.message;
  } finally {
    cmpLendo.delete(p); cmpSalvar();
    if (lastRoute === "comparar") renderComparar();
  }
}

async function cmpCodificar(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const b64 = b => { let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  if (window.CompressionStream){
    const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + b64(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return "j" + b64(bytes);
}
async function cmpLink(){
  const limpa = p => { const o = {}; for (const [k, v] of Object.entries(p)){ if (k === "src" || k.startsWith("_")) continue; if (Array.isArray(v) ? v.length : String(v || "").trim()) o[k] = Array.isArray(v) ? v : String(v).trim(); } return o; };
  const obj = { t: CMP.t.trim(), para: CMP.para.trim(), d: new Date().toLocaleDateString("pt-BR"), p: CMP.p.map(limpa) };
  return CMP_URL + "#" + await cmpCodificar(obj);
}

function cmpResumo(p){
  const n = cmpFaltando(p).length;
  return n ? `<b class="falta">faltam ${n}</b>` : `<b class="ok">✓ completo</b>`;
}
function cmpColHTML(p, i){
  const f = p.ft || [];
  const campo = ([k, rot, ph, area]) => `<label><span>${esc(rot)}${!CMP_OPC.has(k) ? ' <i class="obr">*</i>' : ""}</span>${area || k === "end" || k === "val" || k === "alug" ?
      `<textarea data-k="${k}" rows="${area ? 6 : 2}" placeholder="${esc(ph || "")}">${esc(p[k] || "")}</textarea>` :
      `<input type="text" data-k="${k}" value="${esc(p[k] || "")}" placeholder="${esc(ph || "")}">`}</label>`;
  return `<div class="cmp-col" data-i="${i}">
    ${f.length ? `<div class="car" data-car><div class="car-track">${f.map(u => `<img src="${esc(u)}" alt="" loading="lazy" draggable="false">`).join("")}</div>
      ${f.length > 1 ? `<button type="button" class="car-btn car-prev" aria-label="Foto anterior" disabled>‹</button><button type="button" class="car-btn car-next" aria-label="Próxima foto">›</button><span class="car-count">1/${f.length}</span>` : ""}</div>`
      : `<div class="car"><div class="car-vazio"><b>${esc(p.n || "Projeto " + (i + 1))}</b>Sem fotos</div></div>`}
    <div class="cmp-h"><span class="num">${i + 1}</span><input type="text" data-k="n" value="${esc(p.n || "")}" placeholder="Nome do projeto" aria-label="Nome do projeto">
      ${i > 0 ? `<button type="button" data-mv title="Mover para a esquerda">←</button>` : ""}
      <button type="button" data-rm title="Remover do comparativo">✕</button></div>
    <div class="cmp-src">${cmpLendo.has(p) || p._pedido ? `<b class="lendo">⏳ Lendo a captação…</b>`
      : p._erro ? `<b style="color:var(--warn)">⚠ Não consegui ler essa captação:</b> ${esc(p._erro)}`
      : p.src ? `Dados do site · <a href="#/p/${esc(p.src)}" style="color:var(--accent-text)">abrir projeto</a> · confira e complete os vazios`
      : p._lido ? `Captação ${esc(p._cod || "")} · <a href="${esc(p.link)}" target="_blank" rel="noopener" style="color:var(--accent-text)">abrir</a> · imóvel pronto; o que a captação não informa ficou "vazio"`
      : "Projeto de fora do site — preencha os campos"}</div>
    <details class="cmp-det"${cmpAbertos.has(i) ? " open" : ""}><summary><span>Informações do projeto</span>${cmpResumo(p)}</summary>
    <div class="cmp-f">
      ${CMP_CAMPOS.map(([g, cs]) => `<h4>${g}</h4>${cs.map(campo).join("")}`).join("")}
      <h4>Link e fotos</h4>
      <label>Link do projeto (aparece como “Ver o projeto completo”)<input type="url" data-k="link" value="${esc(p.link || "")}" placeholder="https://…"></label>
      <label>Fotos — endereços de imagem (um por linha)<textarea data-k="ft" rows="3" placeholder="https://…/fachada.jpg">${esc(f.join("\n"))}</textarea></label>
    </div></details>
  </div>`;
}
function renderComparar(){
  document.title = "Comparar · Novos Lançamentos";
  for (const p of CMP.p){
    if (!p.src || !BY_SLUG[p.src]) continue;
    const novo = cmpDoSite(BY_SLUG[p.src]);
    for (const k of Object.keys(novo)) if (!(Array.isArray(p[k]) ? p[k].length : String(p[k] || "").trim())) p[k] = novo[k];
    delete p.lanc;
  }
  CMP.p.forEach(p => { if (p.link && !p.src && !p._lido && !p._erro && cmpLinkCaptacao(p.link)) cmpLer(p); });
  const nomes = DATA.map(l => l.n).sort((a, b) => a.localeCompare(b, "pt-BR"));
  $("#app").innerHTML = `
    <a class="back" href="#/${lastListQuery}">← Todos os lançamentos</a>
    <div class="cmp-top"><div><h1>Comparar empreendimentos</h1>
      <p>Escolha de 2 a 4 projetos do site ou imóveis captados (link da Captação), confira e complete as informações e gere um link para o cliente. <b>Para gerar o link, todos os campos com * precisam estar preenchidos</b> — só condomínio e aluguel são opcionais.</p></div></div>
    <div class="box cmp-add">
      <label>Projeto do site<span class="in"><input id="cmp-busca" list="cmp-nomes" type="search" placeholder="Digite o nome…" autocomplete="off"><button class="btn" id="cmp-addsite" type="button">Adicionar</button></span>
        <datalist id="cmp-nomes">${nomes.map(n => `<option value="${esc(n)}">`).join("")}</datalist></label>
      <label>Ou cole o link de um imóvel captado (＋ Captação)<span class="in"><input id="cmp-url" type="url" placeholder="https://captacao-zff…/imovel/…"><button class="btn" id="cmp-addurl" type="button">Adicionar</button></span></label>
    </div>
    <div class="box cmp-meta">
      <label>Título do estudo<input id="cmp-t" type="text" value="${esc(CMP.t)}" placeholder="Comparativo de empreendimentos"></label>
      <label>Para o cliente (opcional)<input id="cmp-para" type="text" value="${esc(CMP.para)}" placeholder="Nome do cliente"></label>
    </div>
    <div class="cmp" id="cmp" style="--n:${Math.max(1, CMP.p.length)}">
      ${CMP.p.length ? CMP.p.map(cmpColHTML).join("") : `<div class="cmp-vazio"><b>Nenhum projeto ainda</b>Adicione projetos do site pelo nome, ou cole o link de um imóvel captado.</div>`}
    </div>
    <div class="cmp-go">
      <button class="btn primary" id="cmp-gerar" type="button">🔗 Gerar link para o cliente</button>
      <button class="btn" id="cmp-ver" type="button">Ver como cliente</button>
      <button class="btn" id="cmp-limpar" type="button">Limpar</button>
      <div class="msg" id="cmp-msg">${CMP.p.length < 2 ? "Adicione pelo menos 2 projetos." : ""}</div>
    </div>`;

  const busca = $("#cmp-busca");
  const addSite = () => {
    const l = DATA.find(x => norm(x.n) === norm(busca.value.trim()));
    if (!l){ busca.focus(); busca.style.borderColor = "var(--warn)"; return; }
    if (cmpAdd(cmpDoSite(l))) renderComparar(); else busca.value = "";
  };
  $("#cmp-addsite").onclick = addSite;
  busca.addEventListener("keydown", e => { if (e.key === "Enter") addSite(); });
  busca.addEventListener("input", () => { busca.style.borderColor = ""; if (DATA.some(x => x.n === busca.value)) addSite(); });
  const addUrl = () => {
    const u = $("#cmp-url").value.trim(); if (!u) return;
    const doSite = cmpPeloLink(u), capt = !doSite && cmpLinkCaptacao(u);
    if (!doSite && !capt){ $("#cmp-msg").textContent = "Esse link não é de um imóvel captado. Gere a captação em ＋ Captação e cole o link dela aqui."; $("#cmp-url").focus(); return; }
    if (capt && CMP.p.some(p => p.link === u)){ alert("Esse imóvel já está no comparativo."); return; }
    const novo = doSite || { n: "", link: u, ft: [] };
    if (!cmpAdd(novo)) return;
    $("#cmp-url").value = "";
    if (capt) cmpLer(novo);
    renderComparar();
  };
  $("#cmp-addurl").onclick = addUrl;
  $("#cmp-url").addEventListener("keydown", e => { if (e.key === "Enter") addUrl(); });
  $("#cmp-t").oninput = e => { CMP.t = e.target.value; cmpSalvar(); };
  $("#cmp-para").oninput = e => { CMP.para = e.target.value; cmpSalvar(); };

  const box = $("#cmp");
  box.addEventListener("input", e => {
    const k = e.target.dataset.k, col = e.target.closest(".cmp-col"); if (!k || !col) return;
    const p = CMP.p[+col.dataset.i];
    p[k] = k === "ft" ? e.target.value.split("\n").map(x => x.trim()).filter(x => /^https?:\/\//i.test(x)) : e.target.value;
    if (e.target.value.trim()) e.target.classList.remove("erro");
    const r = col.querySelector(".cmp-det summary b"); if (r) r.outerHTML = cmpResumo(p);
    cmpSalvar();
  });
  box.addEventListener("toggle", e => {
    const col = e.target.closest(".cmp-col"); if (!col || !e.target.matches(".cmp-det")) return;
    e.target.open ? cmpAbertos.add(+col.dataset.i) : cmpAbertos.delete(+col.dataset.i);
  }, true);
  box.addEventListener("change", e => { if (e.target.dataset.k === "ft") renderComparar(); });
  box.addEventListener("click", e => {
    const col = e.target.closest(".cmp-col"); if (!col) return;
    const i = +col.dataset.i;
    if (e.target.closest("[data-rm]")){ CMP.p.splice(i, 1); cmpSalvar(); renderComparar(); }
    else if (e.target.closest("[data-mv]")){ const [x] = CMP.p.splice(i, 1); CMP.p.splice(i - 1, 0, x); cmpSalvar(); renderComparar(); }
  });

  const msg = $("#cmp-msg");
  const pronto = () => {
    if (CMP.p.length < 2){ msg.textContent = "Adicione pelo menos 2 projetos."; return false; }
    if (CMP.p.some(p => cmpLendo.has(p))){ msg.textContent = "Aguarde terminar a leitura do link (⏳) antes de gerar."; return false; }
    const faltas = CMP.p.map(cmpFaltando);
    if (faltas.every(f => !f.length)) return true;
    let primeiro = null;
    document.querySelectorAll(".cmp-col").forEach((col, i) => {
      if (!faltas[i].length) return;
      col.querySelector(".cmp-det").open = true; cmpAbertos.add(i);
      col.querySelectorAll("[data-k]").forEach(el => {
        const k = el.dataset.k;
        if (k === "link" || k === "ft" || CMP_OPC.has(k) || el.value.trim()) return;
        el.classList.add("erro"); primeiro = primeiro || el;
      });
    });
    msg.innerHTML = `<b style="color:var(--warn)">Complete antes de gerar o link</b> (só condomínio e aluguel são opcionais) — ` +
      CMP.p.map((p, i) => faltas[i].length ? `<b>${esc(p.n || "Projeto " + (i + 1))}</b>: ${esc(faltas[i].join(", "))}` : "").filter(Boolean).join(" · ");
    if (primeiro){ primeiro.scrollIntoView({ block: "center", behavior: "smooth" }); primeiro.focus({ preventScroll: true }); }
    return false;
  };
  $("#cmp-gerar").onclick = async () => {
    if (!pronto()) return;
    const url = await cmpLink();
    let ok = true;
    try { await navigator.clipboard.writeText(url); }
    catch(e){ const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch(_){ ok = false; } ta.remove(); }
    msg.innerHTML = `${ok ? "✓ Link copiado — é só colar para o cliente." : "Copie o link abaixo:"} <input type="text" readonly value="${esc(url)}" onfocus="this.select()" style="width:100%;margin:4px 0;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-size:12.5px" aria-label="Link do comparativo"> <a href="${esc(url)}" target="_blank" rel="noopener">abrir</a> · <a href="https://wa.me/?text=${encodeURIComponent(url)}" target="_blank" rel="noopener">enviar pelo WhatsApp</a>`;
  };
  $("#cmp-ver").onclick = async () => { if (pronto()) window.open(await cmpLink(), "_blank", "noopener"); };
  $("#cmp-limpar").onclick = () => { if (!CMP.p.length || confirm("Apagar este comparativo e começar outro?")){ CMP = { t: "", para: "", p: [] }; cmpSalvar(); renderComparar(); } };
}

/* ---------- router ---------- */
let lastListQuery = "";
let lastRoute = "";
function route(){
  const h = location.hash || "#/";
  if (/^#\/comparar/.test(h)){ lastRoute = "comparar"; renderComparar(); window.scrollTo(0, 0); return; }
  const m = h.match(/^#\/p\/([^/?]+)(?:\/([^/?]+))?/);
  if (m){
    const isNewProject = !lastRoute.startsWith("p/" + m[1]);
    lastRoute = "p/" + m[1];
    renderDetail(decodeURIComponent(m[1]), m[2] || "resumo");
    if (isNewProject) window.scrollTo(0, 0);
  } else {
    const wasDetail = lastRoute.startsWith("p/");
    lastRoute = "list";
    F = loadState(); lastListQuery = stateQuery();
    renderList();
    if (wasDetail && listScroll) window.scrollTo(0, listScroll);
  }
}
let listScroll = 0;
document.addEventListener("click", e => { const a = e.target.closest('a[href^="#/p/"]'); if (a && lastRoute === "list"){ listScroll = window.scrollY; lastListQuery = stateQuery(); } });
window.addEventListener("hashchange", route);
cmpBadge();
route();
})();
</script>
